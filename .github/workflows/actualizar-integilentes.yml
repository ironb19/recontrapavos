name: Actualizar último episodio de Integilentes
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el último episodio de la playlist
        run: python3 scripts/actualizar_episodio.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Guardar cambios si aparece un episodio nuevo
        run: |
          if git diff --quiet -- data/ultimo-episodio.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ultimo-episodio.json
          git commit -m "Actualizar último episodio de Integilentes"
          git push
